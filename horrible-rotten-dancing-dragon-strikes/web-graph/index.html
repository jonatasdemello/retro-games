<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horrible Rotten Dancing Dragon Strikes (Text + Image)</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #121821;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #4aa3ff;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .game {
      width: min(1200px, 96vw);
      background: var(--panel);
      border: 1px solid #1f2a36;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      color: var(--accent);
      letter-spacing: 0.3px;
    }
    .columns {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
      gap: 16px;
      align-items: start;
    }
    #output {
      background: #0b1118;
      border: 1px solid #1b2633;
      border-radius: 8px;
      padding: 12px;
      min-height: 360px;
      max-height: 60vh;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.35;
    }
    .input-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    #command {
      flex: 1;
      background: #0b1118;
      color: var(--text);
      border: 1px solid #1b2633;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 16px;
    }
    #submit {
      background: var(--accent);
      color: #08121c;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }
    #submit:disabled, #command:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .image-panel {
      background: #0b1118;
      border: 1px solid #1b2633;
      border-radius: 8px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .image-frame {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #0a0f14;
      border: 1px solid #1b2633;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #room-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #room-name {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>Horrible Rotten Dancing Dragon Strikes — Text Edition</h1>
    <div class="columns">
      <div class="text-panel">
        <div id="output" aria-live="polite"></div>
        <form id="form" class="input-row" autocomplete="off">
          <input id="command" type="text" placeholder="What now?" />
          <button id="submit" type="submit">Enter</button>
        </form>
        <div class="hint">Commands: N, S, E, W, GO NORTH, LOOK, GET, DROP, INVENTORY, PUSH, HIT, DANCE, EAT, FEED, QUIT</div>
      </div>
      <div class="image-panel">
        <div class="image-frame">
          <img id="room-image" alt="" />
        </div>
        <div id="room-name"></div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
